[package]
name = "strata"
version = "0.2.1"
edition = "2021"
description = "Mastering with adjustment layers: Tone, Glue, Warmth, Width and a true-peak limiter, with loudness meters"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
